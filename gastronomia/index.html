<style>
:root { --fundo: #141413; --gap: clamp(10px, 2vw, 28px); --creme: #f3ece2; --tinta: #1d1d1b; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--fundo); scroll-behavior: smooth; }
body { background: var(--fundo); padding: var(--gap); display: flex; flex-direction: column; align-items: center; gap: var(--gap); min-height: 100vh; }
.tela { position: relative; width: min(100%, 1680px, calc((100vh - 2 * var(--gap)) * 16 / 9)); aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden; border-radius: clamp(4px, .6vw, 10px); background: #1d1d1b; scroll-margin: var(--gap); }
.tela > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vid { position: absolute; border-radius: calc(var(--r) / 1920 * 100cqw); overflow: hidden; }
.vid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease; background: transparent; }
.vid video.on { opacity: 1; }
.vid.tem-som { cursor: pointer; }
.som { position: absolute; right: calc(16 / 1920 * 100cqw); bottom: calc(16 / 1920 * 100cqw); width: calc(52 / 1920 * 100cqw); height: calc(52 / 1920 * 100cqw); min-width: 26px; min-height: 26px; border: 0; border-radius: 50%; background: var(--creme); color: var(--tinta); display: grid; place-items: center; cursor: pointer; opacity: .92; box-shadow: 0 2px 10px rgba(0,0,0,.25); transition: transform .2s ease, opacity .2s ease; }
.som:hover { transform: scale(1.08); opacity: 1; }
.som:focus-visible { outline: 2px solid var(--creme); outline-offset: 3px; }
.som svg { width: 56%; height: 56%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.som svg .alto { fill: currentColor; stroke: none; }
.som .ondas { display: none; }
.com-som .som .ondas { display: inline; }
.com-som .som .mudo { display: none; }
.com-som .som { background: var(--tinta); color: var(--creme); opacity: 1; }
.tela img.sobre { inset: auto; z-index: 2; pointer-events: none; }
.tela a { position: absolute; border-radius: 999px; z-index: 3; }
.tela a:focus-visible { outline: 2px solid var(--creme); outline-offset: 2px; }
@media (max-width: 760px) { .tela { width: 100%; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

<script>
const vs = [...document.querySelectorAll('video[data-src]')];
const ligar = v => { if (!v.src) v.src = v.dataset.src; const p = v.play(); if (p) p.catch(() => {}); };
const mudo = v => { v.muted = true; const b = v.closest('.vid'); b.classList.remove('com-som'); const s = b.querySelector('.som'); if (s) { s.setAttribute('aria-label', 'Ouvir com som'); s.title = 'Clique para ouvir'; } };
vs.forEach(v => v.addEventListener('playing', () => v.classList.add('on')));
document.querySelectorAll('.vid.tem-som').forEach(box => {
  const v = box.querySelector('video'), s = box.querySelector('.som');
  box.addEventListener('click', e => {
    e.preventDefault();
    if (v.muted) {
      vs.forEach(o => { if (o !== v && !o.muted) mudo(o); });
      if (!v.src) v.src = v.dataset.src;
      v.muted = false; v.currentTime = 0;
      const p = v.play(); if (p) p.catch(() => {});
      box.classList.add('com-som'); s.setAttribute('aria-label', 'Tirar o som'); s.title = 'Clique para tirar o som';
    } else mudo(v);
  });
});
const io = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting) ligar(v); else if (v.src) { v.pause(); if (!v.muted) mudo(v); }
}), { rootMargin: '50% 0px' });
vs.forEach(v => io.observe(v));
document.addEventListener('keydown', e => {
  if (!['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp'].includes(e.key) || e.metaKey || e.ctrlKey) return;
  const telas = [...document.querySelectorAll('.tela')];
  const atual = telas.findIndex(t => t.getBoundingClientRect().top > -10);
  const prox = ['ArrowDown', 'PageDown'].includes(e.key) ? Math.min(telas.length - 1, atual + (telas[atual] && telas[atual].getBoundingClientRect().top < 30 ? 1 : 0)) : Math.max(0, atual - 1);
  e.preventDefault(); telas[prox].scrollIntoView({ behavior: 'smooth', block: 'center' });
});
</script>
